<script type="module">
import { isPassiveDemoSkill, playSkill } from "./motion-scenes.js";
import { demoTakeCards } from "./motion-take-cards.js";
import { renderDemoBack, renderDemoCard } from "./motion-card-face.tsx";
import { HERO_CATALOG, STANDARD_DECK_TEMPLATES, formatRankLabel, formatSuitSymbol } from "@lkdf/shared";
const board=document.querySelector('iframe'), stage=document.querySelector('#stage'), status=document.querySelector('output');
const buttons=[...document.querySelectorAll('[data-scene]')];
let clearSkillChip=()=>{};
function mountSkillChip(frame,hero,skill,reduced){
 const original=[...frame.querySelectorAll('.lkdf-hero-skill-label')];
 let chip=original.find(item=>item.dataset.hoverName===skill.nameVi);
 const fallback=!chip;
 if(fallback){
   const row=original[0]?.parentElement;
   if(!row)return ()=>{};
   chip=frame.ownerDocument.createElement('span');
   chip.className='lkdf-hero-skill-label';
   chip.textContent=skill.nameVi;
   chip.title=hero.nameVi+' · '+skill.descriptionVi;
   row.setAttribute('data-demo-skill-stand-in','');
   row.append(chip);
 }
 const animations=[];
 clearSkillChip=()=>{
   animations.forEach(animation=>animation.cancel());
   chip.removeAttribute('data-demo-skill-highlight');
   if(fallback){
     chip.parentElement?.removeAttribute('data-demo-skill-stand-in');
     chip.remove();
   }
 };
 return (passive, pulse=true)=>{
   chip.dataset.demoSkillHighlight=passive?'passive':'active';
   if(reduced||!pulse)return;
   animations.forEach(animation=>animation.cancel());
   animations.length=0;
   animations.push(chip.animate([
     { transform:'scale(1)', filter:'brightness(1)' },
     { transform:'scale(1.10)', filter:'brightness(1.6)', offset:.42 },
     { transform:'scale(1)', filter:'brightness(1)' }
   ],{ duration:240, easing:'ease-out' }));
 };
}
function styleDemoBoard(){
 const doc=board.contentDocument;
 if(!doc?.head||doc.getElementById('demo-board-layout'))return;
 const style=doc.createElement('style');
 style.id='demo-board-layout';
 const passiveChips=HERO_CATALOG.flatMap(hero=>hero.skills)
   .filter(skill=>isPassiveDemoSkill(skill.id))
   .map(skill=>'.lkdf-hero-skill-label[data-hover-name="'+CSS.escape(skill.nameVi)+'"]')
   .join(',\n  ');
 style.textContent=`
  .lkdf-battle-pile > span { display:none; }
  [data-demo-skill-stand-in] > :not([data-demo-skill-highlight]) { visibility:hidden; }
  [data-demo-skill-stand-in] > [data-demo-skill-highlight] { position:absolute; inset:0 auto auto 0; }
  html .lkdf-hero-skill-label {
   border-color:#777d86; background:#353940; color:#eef0f3;
  }
  ${passiveChips},
  .lkdf-hero-skill-label[data-demo-skill-highlight="passive"] {
   border-color:#bbe8d0; background:#b2dfc9; color:#163a2d;
  }
  .lkdf-hero-skill-label[data-demo-skill-highlight] {
   z-index:2; box-shadow:0 0 8px #c1c8d588;
  }
  .lkdf-hero-skill-label[data-demo-skill-highlight="passive"] {
   box-shadow:0 0 8px #9fe3bbaa;
  }
  .lkdf-battle-dock { height:calc(var(--dock-h, 196px) + 36px); }
  .lkdf-hand-turn-bar { flex:0 0 36px; }
  .lkdf-hand-turn-bar:not(:empty) { margin:0; }
  .lkdf-hand-turn-bar .lkdf-action-bar { min-height:0; }
  .lkdf-battle-card-line button.lkdf-card-gwent:not(:last-child) {
   scale:.86; filter:brightness(.58) saturate(.62);
  }
  .lkdf-battle-card-line button.lkdf-card-gwent:last-child { scale:1.33; }
 `;
 doc.head.append(style);
}
let scene=0, generation=0;
const pace=ms=>Math.round(ms*1.15);
const wait=ms=>new Promise(resolve=>setTimeout(resolve,pace(ms)));
function element(type,cls){const el=document.createElement(type);el.className=cls;stage.append(el);return el}
function drawOrigin(center){
 const pile=board.contentDocument?.querySelector('[data-motion-draw-pile]');
 return pile?point(pile):[center[0]-106,center[1]];
}
function point(el){
 const rect=el.getBoundingClientRect(), host=stage.getBoundingClientRect();
 const frame=el.ownerDocument.defaultView.frameElement?.getBoundingClientRect();
 return [rect.left+rect.width/2+(frame?.left??0)-host.left,rect.top+rect.height/2+(frame?.top??0)-host.top];
}
function place(el,[x,y]){el.style.left=x+'px';el.style.top=y+'px'}
function card(key,name,origin,end,printing){
 const el=element('div','piece');renderDemoCard(el,key,name,printing);
 place(el,[end[0]-35,end[1]-48]);move(el,origin,end);return el
}
function move(el,a,b){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)el.animate([{translate:(a[0]-b[0])+'px '+(a[1]-b[1])+'px',transform:'rotate(-5deg)'},{translate:'none',transform:'none'}],{duration:pace(340),easing:'cubic-bezier(.2,.72,.2,1)'})}
async function throwToTable(el, from, to) {
 const landingAngle = (Math.random() < .5 ? -1 : 1) * (2 + Math.random() * 3);
 const landing = 'rotate('+landingAngle+'deg)';
 el.style.transform = landing;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const dx=from[0]-to[0],dy=from[1]-to[1];
 const pose=(x,y,angle,scale)=>({translate:x+'px '+y+'px',transform:'rotate('+angle+'deg) scale('+scale+')'});
 const flight=el.animate([
   {...pose(dx,dy,0,1),offset:0,easing:'ease-out'},
   {...pose(dx+dx*.045,dy-20,-7,1.04),offset:.24},
   {...pose(dx+dx*.045,dy-20,-7,1.04),offset:.33,easing:'cubic-bezier(.45,0,.68,.65)'},
   {...pose(-dx*.035,5,4,.98),offset:.76,easing:'ease-out'},
   {...pose(0,-4,landingAngle*.65,1),offset:.9,easing:'ease-in-out'},
   {translate:'none',transform:landing,offset:1},
 ],{duration:pace(630)});
 await flight.finished;
}
function label(p,t){stage.querySelector('.mark')?.remove();const el=element('div','mark');el.textContent=t;place(el,[Math.max(4,Math.min(stage.clientWidth-el.offsetWidth-4,p[0]-el.offsetWidth/2)),p[1]+13])}
async function playCardHit(seat,lostHealth,sourceCard){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){
   showHealthLoss(seat,lostHealth);
   return;
 }
 const hitGeneration=generation;
 const [x,y]=point(seat);
 const fromX=sourceCard.offsetLeft+sourceCard.offsetWidth/2;
 const fromY=sourceCard.offsetTop+sourceCard.offsetHeight/2;
 const dx=x-fromX,dy=y-fromY;
 const distance=Math.hypot(dx,dy)||1;
 const directionX=dx/distance,directionY=dy/distance;
 const resting={translate:'none',transform:sourceCard.style.transform||'none'};
 const pose=(px,py,angle,scale)=>({translate:px+'px '+py+'px',transform:'rotate('+angle+'deg) scale('+scale+')'});
 sourceCard.style.zIndex='13';
 const strike=sourceCard.animate([
   resting,
   {...pose(-directionX*12,-directionY*12,-8,1.02),offset:.25},
   pose(dx,dy,6,.91)
 ],{duration:pace(360),easing:'cubic-bezier(.45,.03,.72,1)',fill:'forwards'});
 await strike.finished;
 if(generation!==hitGeneration)return;
 seat.animate([
   {transform:'none',filter:'brightness(1)'},
   {transform:'translate('+directionX*7+'px,'+directionY*7+'px)',filter:'brightness(1.2)',offset:.22},
   {transform:'none',filter:'brightness(1)'}
 ],{duration:pace(170),easing:'ease-out'});
 showHealthLoss(seat,lostHealth);
 // Return the played card to the table after it rebounds from the target.
 const rebound=sourceCard.animate([
   pose(dx,dy,6,.91),
   {...pose(dx*.73,dy*.73,-9,1),offset:.28},
   resting
 ],{duration:pace(235),easing:'ease-out'});
 strike.cancel();
 await rebound.finished;
 sourceCard.style.removeProperty('z-index');
}
async function playDodge(seat,attackCard){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const [x,y]=point(seat);
 const dx=x-attackCard.offsetLeft-attackCard.offsetWidth/2;
 const dy=y-attackCard.offsetTop-attackCard.offsetHeight/2;
 const duration=650;
 const side=dx>=0?-1:1;
 seat.animate([
   {opacity:1,transform:'none',filter:'none'},
   {opacity:1,transform:'translateX('+side*3+'px)',offset:.23},
   {opacity:.32,transform:'translate('+side*12+'px,-5px)',
    filter:'drop-shadow('+(-side*13)+'px 2px 2px #80c8db)',offset:.4},
   {opacity:.48,transform:'translate('+side*12+'px,-5px)',
    filter:'drop-shadow('+(-side*9)+'px 2px 3px #80c8db)',offset:.65},
   {opacity:1,transform:'none',filter:'none'}
 ],{duration,easing:'ease-in-out'});
 await attackCard.animate([
   {translate:'none',transform:attackCard.style.transform||'none'},
   {translate:(dx*.2)+'px '+(dy*.2)+'px',transform:'rotate(-5deg)',offset:.29},
   {translate:dx+'px '+dy+'px',transform:'rotate(10deg)',offset:.5},
   {translate:(dx*1.22)+'px '+(dy*1.22)+'px',transform:'rotate(17deg)',offset:.65},
   {transform:'none'}
 ],{duration,easing:'ease-in-out'}).finished;
}
function playHeal(seat){
 const bounds=seat.getBoundingClientRect();
 const glow=element('div','heal-outline');
 place(glow,[bounds.left,bounds.top]);
 Object.assign(glow.style,{width:bounds.width+'px',height:bounds.height+'px'});
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 glow.animate([{opacity:.25},{opacity:1,offset:.24},{opacity:0}],{duration:pace(700)}).finished.then(()=>glow.remove());
 for(const [nx,ny] of [[.13,.38],[.33,.18],[.55,.46],[.73,.2],[.87,.55],[.39,.71]]){
   const plus=element('span','heal-plus');

 const scale=Math.min(devicePixelRatio,1.5);canvas.width=w*scale;canvas.height=h*scale;canvas.style.width=w+'px';canvas.style.height=h+'px';
 const ctx=canvas.getContext('2d');if(!ctx){canvas.remove();return}ctx.scale(scale,scale);
 const start=performance.now(),ox=origin[0]-left,oy=origin[1]-top,tx=target[0]-left,ty=target[1]-top;
 // Fletching, shaft and forged head share a single local coordinate system.
 function arrow(x,y,angle){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);
 ctx.fillStyle='#281910';ctx.fillRect(-43,-1.8,38,3.6);ctx.fillStyle='#e4bc78';ctx.fillRect(-39,-1,34,1);
 for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(-29,0);ctx.lineTo(-39,side*5);ctx.lineTo(-47,side*5);ctx.lineTo(-41,0);ctx.fillStyle='#e0c7a0';ctx.fill()}
 ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(-8,-4);ctx.lineTo(-6,0);ctx.lineTo(-8,4);ctx.closePath();ctx.fillStyle='#c4cbd1';ctx.fill();ctx.restore()
 }
 function draw(now){
 if(!canvas.isConnected)return;
 const age=(now-start)/1.15;ctx.clearRect(0,0,w,h);
 for(let i=0;i<7;i++){
 const t=(age-i*44)/510;if(t<0||t>1.74)continue;
 const u=Math.min(1,t),dx=tx-ox+(i-3)*8,dy=ty-oy+Math.sin(i*3)*16,lift=48+i*5;
 const x=ox+dx*u,y=oy+dy*u-4*lift*u*(1-u);
 ctx.globalAlpha=Math.min(1,(1.74-t)*3);
 arrow(x,y,Math.atan2(dy-4*lift*(1-2*u),dx));
 if(t>=1){const impact=(t-1)/.74;for(let j=0;j<6;j++){const angle=j*2.4+i;const dist=impact*(16+j*3);ctx.fillStyle=j%2?'#edc887':'#251b17';ctx.fillRect(x+Math.cos(angle)*dist,y+Math.sin(angle)*dist+9*impact*impact,3-impact*2,3-impact*2)}}
 }
 ctx.globalAlpha=1;if(age<1180)requestAnimationFrame(draw);else canvas.remove()
 }
 requestAnimationFrame(draw)
}

 const [heroId,skillId]=picker.value.split('/');

 if(center)center.style.visibility='hidden';
 const bounds=surface?.getBoundingClientRect();
 const c=bounds?[bounds.left+bounds.width*.5,bounds.top+bounds.height*.60]:[stage.clientWidth*.5,stage.clientHeight*.5];
 c.surface=surface;
 c.drawOrigin=()=>drawOrigin(c);
 const frames=[...(doc?.querySelectorAll('[data-drop-seat]')||[])].filter(el=>el.offsetWidth);
 const caster=frames.find(el=>el.querySelector('button[aria-label]')?.getAttribute('aria-label')==='Xem kỹ năng tướng '+hero.nameVi);
 const actor=caster??frames[0];

 const seatPoints=ordered.map(el=>Object.assign(point(el),{frame:el}));
 if(seatPoints.length<2){status.textContent='Đang tải bàn';await wait(300);if(generation===current)showHero();return}

 await playSkill({skillId,hero,stage,center:c,seats:seatPoints,status,highlight,active:()=>generation===current});
}

 if(!previous.length)stage.replaceChildren();

 center.style.visibility='hidden';

 face.style.cssText='position:absolute;z-index:7;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid #6e7889;border-radius:6px;width:'+liveRect.width+'px;height:'+liveRect.height+'px';

 }
 place(face,[end[0]-liveRect.width/2,end[1]-liveRect.height/2]);
 status.textContent='Đang đánh lá từ tay xuống bàn';

 face.classList.remove('demo-stack-flight');
 if(current!==generation)return;

 stack.slice(0,-5).forEach(card=>card.remove());
 stack.slice(-5).reverse().forEach((card,depth)=>{

 });
 status.textContent='Lá mới ở trên cùng · Lá mờ là dấu vết hiển thị';
};
const equipmentDetail=document.querySelector('#equipment-detail');

function showEquipmentDetail(entry,printing,rect){

 document.querySelector('#equipment-description').textContent=entry.description;
 equipmentDetail.hidden=false;
 const gap=8,width=equipmentDetail.offsetWidth,height=equipmentDetail.offsetHeight;
 equipmentDetail.style.left=Math.max(gap,rect.right+gap+width<=innerWidth?rect.right+gap:rect.left-gap-width)+'px';

}
function hoverCard(event){
 const card=event.target.closest('.demo-card-face');
 if(!card||card.contains(event.relatedTarget))return;
 const info=card.querySelector('[data-hover-name]');
 if(!info)return;
 if(event.type==='pointerout'){hideEquipmentDetail();return}
 showEquipmentDetail({name:info.dataset.hoverName,description:info.dataset.hoverDescription},'',card.getBoundingClientRect());
}

stage.addEventListener('pointerout',hoverCard);

async function showDeath(){
 clearSkillChip();
 const doc=board.contentDocument;
 const target=[...(doc?.querySelectorAll('[data-drop-seat]')||[])].filter(el=>el.offsetWidth)[1];
 const center=doc?.querySelector('.lkdf-battle-center-stack');
 if(!target||!center){status.textContent='Đang tải bàn';return}
 const id=++generation;
 stage.replaceChildren();
 center.style.visibility='hidden';
 const middle=point(center);
 status.textContent='Diễn tập · mục tiêu còn 1 máu';
 const attacker=doc.querySelector('[data-motion-self]');
 const playedCard=card('sat','Sát',attacker?point(attacker):middle,middle);
 playedCard.classList.add('demo-active-face');
 await wait(430);
 if(id!==generation)return;
 await playCardHit(target,1,playedCard);
 if(id!==generation)return;
 status.textContent='Hấp hối · chờ Đào cứu viện';
 const tag=element('div','death-tag');
 tag.textContent='Hấp hối · chờ Đào';
 const bounds=target.getBoundingClientRect();
 place(tag,[bounds.left+bounds.width/2,bounds.top-5]);
 await wait(1500);
 if(id!==generation)return;
 stage.replaceChildren();
 const shade=element('div','death-shade');
 place(shade,[bounds.left,bounds.top]);
 shade.style.width=bounds.width+'px';shade.style.height=bounds.height+'px';
 const health=target.querySelector('[aria-label^="Sinh lực "]');
 const maximum=health?.getAttribute('aria-label').match(/ trên (\d+)$/)?.[1];
 const exhausted=element('div','death-health');
 exhausted.textContent=maximum?'0/'+maximum:'0 máu';
 const healthBounds=health?.getBoundingClientRect();
 place(exhausted,[healthBounds?.left??bounds.left+5,healthBounds?.top??bounds.bottom-22]);
 status.textContent='Hết cơ hội cứu viện · 0 máu';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
   shade.animate([{opacity:0},{opacity:1}],{duration:pace(520),easing:'ease-out'});
 }
}
