appId: com.lkdf.tamquocsat
productName: Tam Quoc Sat
artifactName: TamQuocSat-Setup-${version}.${ext}
electronVersion: 45.3.3
asar: true
npmRebuild: false
directories:
  buildResources: assets
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tam Quoc Sat
  deleteAppDataOnUninstall: false
publish:
  provider: generic
  url: https://update.lkdf.invalid/api/update/
