appId: com.cuuchauankiem.game
productName: Blades of the Nine Realms
artifactName: BladesOfTheNineRealms-Setup-${version}.${ext}
electronVersion: 45.3.3
asar: true
npmRebuild: false
directories:
  buildResources: assets
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blades of the Nine Realms
  deleteAppDataOnUninstall: false
