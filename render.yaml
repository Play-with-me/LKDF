services:
  - type: web
    name: lkdf-tam-quoc-sat-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --workspace=@lkdf/server --workspace=@lkdf/shared --include-workspace-root && npm run build:shared && npm run build --workspace=@lkdf/server
    startCommand: npm run start --workspace=@lkdf/server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: Play-with-me/LKDF
      - key: GITHUB_RELEASE_TOKEN
        sync: false
